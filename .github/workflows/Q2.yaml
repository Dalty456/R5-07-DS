name: Q2 Workflow

on:
  push:
    branches: [ "main" ]
    paths:
      - "XYZ.txt"
      - ".github/workflows/Q2.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-q2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Q2_archive_XYZ.txt
        run: |
          EXEC_DATE=$(date -u +"%d/%m/%Y %H:%M:%S UTC")
          TAIL_SIZE=$(wc -c < XYZ.txt)
          {
            echo "Nom et prénom : Valentin LEROY"
            echo "Date et heure d'exécution : $EXEC_DATE"
            echo "Taille de XYZ.txt : $TAIL_SIZE octets"
            echo "Contenu de XYZ.txt :"
            cat XYZ.txt
          } > Q2_archive_XYZ.txt

      - name: Commit and push Q2_archive_XYZ.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q2_archive_XYZ.txt
          git commit -m "Q2: create Q2_archive_XYZ.txt" || exit 0
          git pull --rebase origin main
          git push

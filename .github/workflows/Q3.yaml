name: Q3 Workflow

on:
  push:
    branches: [ "main" ]
    paths:
      - "Q3.java"
      - ".github/workflows/Q3.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-q3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and test Q3.java
        run: |
          javac Q3.java
          java Q3 5

      - name: Create Q3_archive_java.txt
        run: |
          {
            echo "Nom et prénom : Valentin LEROY"
            echo "Contenu de Q3.java :"
            cat Q3.java
          } > Q3_archive_java.txt

      - name: Commit and push Q3_archive_java.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q3_archive_java.txt
          git commit -m "Q3: create Q3_archive_java.txt" || exit 0
          git pull --rebase origin main
          git push

name: Q5 Workflow

on:
  push:
    branches: [ "main" ]
    paths:
      - "Q5.java"
      - ".github/workflows/Q5.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-q5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and test Q5.java
        run: |
          javac Q5.java
          java Q5 4

      - name: Create Q5_archive_JJ-MM-AAAA.txt
        run: |
          DATE_STR=$(date +"%d-%m-%Y")
          FILENAME="Q5_archive_${DATE_STR}.txt"
          {
            echo "Nom et prénom : Valentin LEROY"
            echo "Contenu de Q5.java :"
            cat Q5.java
          } > "$FILENAME"

      - name: Commit and push Q5_archive_JJ-MM-AAAA.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q5_archive_*.txt
          git commit -m "Q5: create $FILENAME" || exit 0
          git pull --rebase origin main
          git push

name: Q4 Workflow

on:
  push:
    branches: [ "main" ]
    paths:
      - "Q4.java"
      - ".github/workflows/Q4.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-q4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and test Q4.java
        run: |
          javac Q4.java
          java Q4 4

      - name: Create Q4_archive_JJ-MM-AAAA.txt
        run: |
          DATE_STR=$(date +"%d-%m-%Y")
          FILENAME="Q4_archive_${DATE_STR}.txt"
          {
            echo "Nom et prénom : Valentin LEROY"
            echo "Contenu de Q4.java :"
            cat Q4.java
          } > "$FILENAME"

      - name: Commit and push Q4_archive_JJ-MM-AAAA.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q4_archive_*.txt
          git commit -m "Q4: create $FILENAME" || exit 0
          git pull --rebase origin main
          git push

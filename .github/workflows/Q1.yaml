name: Q1 Workflow

on:
  push:
    branches: [ "main" ]
    paths:
      - "XYZ.txt"
      - ".github/workflows/Q1.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-q1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy XYZ.txt to Q1_archive_XYZ.txt
        run: |
          cp XYZ.txt Q1_archive_XYZ.txt

      - name: Commit and push Q1_archive_XYZ.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Q1_archive_XYZ.txt
          git commit -m "Q1: create Q1_archive_XYZ.txt" || exit 0
          git pull --rebase origin main
          git push
